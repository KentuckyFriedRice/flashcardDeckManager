<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard Editor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-image:url("https://th.bing.com/th/id/OIP.0Uv8GRgvIAntSDbko-V28gHaE8?rs=1&pid=ImgDetMain");
	        background-repeat: repeat;
        }
        #main {
            width: 50%;
            margin: auto;
        }
        h1 {
            text-align: center;
        }
        .entry {
            border: 1px solid #ccc;
            background-color: white;
            width:500px;
            margin:auto;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
        }
        .entry input {
            width: calc(100% - 20px);
            margin-bottom: 5px;
        }
        .actions button {
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <div id="main">
        <h1>Flashcard Editor</h1>
        <input type="file" id="fileInput" accept="application/json" onchange="loadJSON(event)" style="margin-bottom: 20px;">
        <div id="entries"></div>
        <button onclick="addEntry()">Add Entry</button>
        <hr/>
        <input type="text" id="inputFileName" name="inputFileName" value="Type File Name Here"><br><br>
        <button onclick="saveJSONToTextArea()">Generate</button>
        <button onclick="downloadJSON()">Download</button>
        <button onclick="splitAndDownload()">Split and Download as ZIP</button>

        <p>If it doesn't download for some reason, generate and paste this text to notepad and save as a .json file.</p>
        <textarea id="output" rows="10" style="width: 100%; margin-top: 20px;"></textarea>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.6.0/jszip.min.js"></script>
    <script>
        let file_name = "file";
        let data = [
            { "question": "Capital of France", "answer": "Paris" },
            { "question": "Largest ocean", "answer": "Pacific" },
            { "question": "Fastest land animal", "answer": "Cheetah" }
        ];

        function renderEntries() {
            const entriesDiv = document.getElementById('entries');
            entriesDiv.innerHTML = '';
            data.forEach((entry, index) => {
                const entryDiv = document.createElement('div');
                entryDiv.className = 'entry';
                entryDiv.innerHTML = "<p>" + (index+1) + "</p>";

                const questionInput = document.createElement('input');
                questionInput.type = 'text';
                questionInput.value = entry.question;
                questionInput.placeholder = 'Question';
                questionInput.oninput = (e) => updateEntry(index, 'question', e.target.value);

                const answerInput = document.createElement('input');
                answerInput.type = 'text';
                answerInput.value = entry.answer;
                answerInput.placeholder = 'Answer';
                answerInput.oninput = (e) => updateEntry(index, 'answer', e.target.value);

                const deleteButton = document.createElement('button');
                deleteButton.textContent = 'Delete';
                deleteButton.onclick = () => deleteEntry(index);

                entryDiv.appendChild(questionInput);
                entryDiv.appendChild(answerInput);
                entryDiv.appendChild(deleteButton);
                entriesDiv.appendChild(entryDiv);
            });
        }

        function updateEntry(index, field, value) {
            data[index][field] = value;
        }

        function addEntry() {
            data.push({ question: '', answer: '' });
            renderEntries();
        }

        function deleteEntry(index) {
            data.splice(index, 1);
            renderEntries();
        }

        function saveJSONToTextArea() {
            const output = document.getElementById('output');
            output.value = JSON.stringify(data, null, 4);
        }

        async function downloadJSON() {
            file_name=document.getElementById('inputFileName').value;
            const blob = new Blob([JSON.stringify(data, null, 4)], { type: 'application/json' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = file_name+'.json';
            link.click();
        }

        function loadJSON(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        data = JSON.parse(e.target.result);
                        file_name=(file.name).split('.')[0];
                        document.getElementById('inputFileName').value=file_name;
                        renderEntries();
                    } catch (error) {
                        alert('Invalid JSON file');
                    }
                };
                reader.readAsText(file);
            }
        }

        async function splitAndDownload() {
            const zip = new JSZip();
            const chunkSize = 10;
            let chunkIndex = 1;

            file_name=document.getElementById('inputFileName').value;

            for (let i = 0; i < data.length; i += chunkSize) {
                const chunk = data.slice(i, i + chunkSize);
                const fileName = file_name+'_'+chunkIndex+'.json';
                zip.file(fileName, JSON.stringify(chunk, null, 4));
                chunkIndex++;
            }

            const content = await zip.generateAsync({ type: "blob" });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(content);
            link.download = file_name+'_collection.zip';
            link.click();
        }

        // Initial render
        renderEntries();
    </script>
</body>
</html>
